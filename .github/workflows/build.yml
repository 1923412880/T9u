name: Build unsigned IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          set -eux
          SELECTED=$(python3 -c "import glob,re; print(max(glob.glob('/Applications/Xcode*.app'), key=lambda p: tuple(map(int, re.search(r'Xcode[_-]?(\d+(?:\.\d+)*)\.app', p).group(1).split('.'))) if re.search(r'Xcode[_-]?(\d+(?:\.\d+)*)\.app', p) else (0,)))")
          if [ -n "$SELECTED" ]; then sudo xcode-select -s "$SELECTED"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: List schemes
        run: xcodebuild -list -project T9u.xcodeproj
      - name: Archive (unsigned)
        run: |
          set -euxo pipefail
          xcodebuild -project T9u.xcodeproj -scheme T9u -configuration Release -destination 'generic/platform=iOS' -archivePath build/T9u.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""
      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          mkdir -p build/Payload
          cp -R build/T9u.xcarchive/Products/Applications/T9u.app build/Payload/
          cd build && zip -qry T9u-unsigned.ipa Payload
          ls -lh T9u-unsigned.ipa
      - name: Archive ScreenOff (unsigned)
        run: |
          set -euxo pipefail
          xcodebuild -project T9u.xcodeproj -scheme ScreenOff -configuration Release -destination 'generic/platform=iOS' -archivePath build/ScreenOff.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""
      - name: Package ScreenOff IPA
        run: |
          set -euxo pipefail
          mkdir -p build/so/Payload
          cp -R build/ScreenOff.xcarchive/Products/Applications/ScreenOff.app build/so/Payload/
          cd build/so && zip -qry ScreenOff-unsigned.ipa Payload
          ls -lh ScreenOff-unsigned.ipa
      - name: Build BlockIntents.dylib
        run: |
          set -euxo pipefail
          mkdir -p blockout
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -O2 -Wall -fobjc-arc -fvisibility=hidden \
            -miphoneos-version-min=13.0 -arch arm64 \
            -isysroot "$SDK" \
            -dynamiclib -install_name @rpath/BlockIntents.dylib \
            -framework Foundation \
            Tweak/BlockIntents.m -o blockout/BlockIntents.dylib
          ls -lh blockout/BlockIntents.dylib
          file blockout/BlockIntents.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: T9u-unsigned-ipa
          path: build/T9u-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenOff-unsigned-ipa
          path: build/so/ScreenOff-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BlockIntents-dylib
          path: blockout/BlockIntents.dylib
          if-no-files-found: error
